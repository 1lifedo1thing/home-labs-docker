services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=192.168.0.105:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=20260912
      - GITEA__mailer__ENABLED=true
      - GITEA__mailer__PROTOCOL=smtp
      - GITEA__mailer__SMTP_ADDR=host.docker.internal
      - GITEA__mailer__SMTP_PORT=11025
      - GITEA__mailer__FROM=gitea@nt.damingerdai.com
      - GITEA__mailer__USER=
      - GITEA__mailer__PASSWD=
      - FORGEJO__server__SSH_PORT=1022
      - FORGEJO__server__SSH_LISTEN_PORT=1022
      - FORGEJO__server__START_SSH_SERVER=true
    restart: always
    volumes:
      - ./forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "13000:3000"
      - "1022:1022"
    extra_hosts:
      - "host.docker.internal:host-gateway"

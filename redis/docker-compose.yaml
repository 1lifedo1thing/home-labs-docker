services:
  redis:
    image: redis:8.10.3-alpine3.23
    container_name: redis
    ports:
      - 6379:6379
    restart: unless-stopped
    volumes:
      - ./redis-data:/data/redis
    networks:
      - redis-network
    extra_hosts:
      - host.docker.interanl:host-gateway

networks:
  redis-network:
    external: false
